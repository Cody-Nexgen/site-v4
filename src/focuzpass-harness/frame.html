<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>frame</title>
<style>
    body { margin: 0; background: #17171a; color: #e4e4e7; font-family: Inter, system-ui, sans-serif; }
    form { display: grid; gap: 10px; padding: 22px; }
    input { height: 36px; padding: 0 10px; border-radius: 7px; border: 1px solid #333338;
            background: #101012; color: #f4f4f5; font-size: 13px; }
</style>
</head>
<body>
<form action="#" method="post" onsubmit="return false">
    <input name="email" type="email" autocomplete="username" placeholder="Email" />
    <input name="password" type="password" autocomplete="current-password" placeholder="Password" />
</form>
<script type="module">
    import { boot } from './harness.ts';
    boot();
</script>
</body>
</html>
