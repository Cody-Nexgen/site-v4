# FocuzNow for iPhone and iPad. Generate the Xcode project with XcodeGen:
#   brew install xcodegen
#   cd ios && xcodegen
# The .xcodeproj is generated (not in git): run `xcodegen` again after pulling.
name: FocuzNow
options:
  bundleIdPrefix: com.focuznow
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

settings:
  base:
    # The Apple Developer team (the account that has the Family Controls entitlement).
    DEVELOPMENT_TEAM: 2YNWK2K7C7
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  FocuzNowKit:
    path: FocuzNowKit

targets:
  FocuzNow:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: FocuzNowKit
      - target: FocusMonitor
      - target: FocusShield
      - target: FocusShieldAction
      - target: FocuzNowWidgets
      - target: PassAutoFill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focuznow.app
        PRODUCT_NAME: FocuzNow
        INFOPLIST_KEY_CFBundleDisplayName: FocuzNow
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FocuzNow
        NSFaceIDUsageDescription: FocuzPass uses Face ID to unlock your passwords.
        # Satoshi (fontshare.com, free licence): drop the three .otf files into App/Fonts.
        # Until then the app falls back to a heavy system font.
        UIAppFonts:
          - Satoshi-Medium.otf
          - Satoshi-Bold.otf
          - Satoshi-Black.otf
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Automatic
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/FocuzNow.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.focuznow.shared]
        keychain-access-groups: [$(AppIdentifierPrefix)com.focuznow.shared]
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.developer.applesignin: [Default]

  FocusMonitor:
    type: app-extension
    platform: iOS
    sources: [Extensions/FocusMonitor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focuznow.app.FocusMonitor
    info:
      path: Extensions/FocusMonitor/Info.plist
      properties:
        CFBundleDisplayName: FocuzNow Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FocusMonitorExtension
    entitlements:
      path: Extensions/FocusMonitor/FocusMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.focuznow.shared]

  FocusShield:
    type: app-extension
    platform: iOS
    sources: [Extensions/FocusShield]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focuznow.app.FocusShield
    info:
      path: Extensions/FocusShield/Info.plist
      properties:
        CFBundleDisplayName: FocuzNow Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: Extensions/FocusShield/FocusShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.focuznow.shared]

  FocusShieldAction:
    type: app-extension
    platform: iOS
    sources: [Extensions/FocusShieldAction]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focuznow.app.FocusShieldAction
    info:
      path: Extensions/FocusShieldAction/Info.plist
      properties:
        CFBundleDisplayName: FocuzNow Shield Action
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: Extensions/FocusShieldAction/FocusShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.focuznow.shared]

  FocuzNowWidgets:
    type: app-extension
    platform: iOS
    sources: [Extensions/Widgets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focuznow.app.Widgets
    info:
      path: Extensions/Widgets/Info.plist
      properties:
        CFBundleDisplayName: FocuzNow
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Extensions/Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.focuznow.shared]

  PassAutoFill:
    type: app-extension
    platform: iOS
    sources: [Extensions/PassAutoFill]
    dependencies:
      - package: FocuzNowKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focuznow.app.PassAutoFill
    info:
      path: Extensions/PassAutoFill/Info.plist
      properties:
        CFBundleDisplayName: FocuzPass
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
    entitlements:
      path: Extensions/PassAutoFill/PassAutoFill.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups: [group.com.focuznow.shared]
        keychain-access-groups: [$(AppIdentifierPrefix)com.focuznow.shared]

schemes:
  FocuzNow:
    build:
      targets:
        FocuzNow: all
    run:
      config: Debug
